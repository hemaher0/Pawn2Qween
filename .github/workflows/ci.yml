name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lock file
        run: uv lock --check
      - name: Sync development environment
        run: uv sync --locked
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check license metadata
        run: uv run --locked reuse lint
      - name: Build distributions
        run: uv build --clear

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    env:
      PYTHONPATH: src
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync runtime environment
        run: uv sync --locked --no-dev
      - name: Run tests
        run: uv run --locked --no-dev python -m unittest discover -s tests -p 'test_*.py'

  e5-runtime:
    runs-on: ubuntu-latest
    env:
      OSSP_TEST_E5_RUNTIME: "1"
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync E5 runtime environment
        run: uv sync --locked --no-dev --group e5-runtime
      - name: Run E5 runtime tests
        run: >-
          uv run --locked --no-dev --group e5-runtime --no-sync
          python -m unittest
          tests.test_binomial_logistic_quality
          tests.test_e5_bilinear_compatibility
          tests.test_e5_binomial_router
          tests.test_e5_onnx_encoder
          tests.test_e5_runtime_dependencies
          tests.test_e5_runtime_packaging
          tests.test_fetch_e5_model

  arm64-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and inspect ARM64 image
        run: ./scripts/build-arm64.sh
