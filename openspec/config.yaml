schema: spec-driven

context: |
  The project is a Python 3.9+ standard-library runtime for a prompt-only LLM
  routing challenge. Development and release tooling uses uv 0.12.3 with
  Python 3.11, PEP 621 metadata, dependency groups, and a committed lock file.
  Public runtime behavior, scoring, schemas, and container isolation rules are
  compatibility-sensitive. Source files use Apache-2.0 SPDX metadata, and
  participant-facing documentation is primarily Korean.
  GitHub Actions CI validates main-branch changes. GitHub Releases are created
  only from supported version tags and never from ordinary branch pushes.

rules:
  proposal:
    - State explicit non-goals when runtime, scoring, or release scope could be ambiguous.
    - Record public-disclosure scope and exclusions in every proposal.
  specs:
    - Include testable failure and safety scenarios for release or automation changes.
    - Keep public specifications understandable without confidential local references.
  tasks:
    - Order migration tasks so consumers move before legacy files are removed.
    - Include a final public-disclosure review before integration or publication.

operations:
  apply:
    guidance:
      - Run focused tests before repository-wide verification.
      - Keep runtime and challenge behavior unchanged unless a spec explicitly changes it.
      - During apply, preserve the public-disclosure boundary defined in CONTRIBUTING.md.
      - Run deterministic checks and verify the public-disclosure boundary before reporting success.
  archive:
    guidance:
      - Before archive, review synced specs and retained history for public disclosure.
