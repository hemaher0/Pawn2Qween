[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ossp-2026-llm-router-challenge"
version = "0.1.0"
description = "Prompt-only router protocol and local scorer for the OSSP 2026 challenge"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
dependencies = []

[project.scripts]
ossp-router = "ossp_router.cli:main"
router-cleanup-resources = "ossp_router.runtime:cleanup_main"
router-evaluate-tier = "ossp_router.orchestrator:main"
router-measure-image = "ossp_router.image_evidence:main"
router-measure-tiebreak = "ossp_router.tiebreak_latency:main"
router-run = "ossp_router.e5_router:main"
router-self-check = "ossp_router.cli:self_check_entry"

[dependency-groups]
dev = [
  "reuse>=6.2,<7",
  "ruff>=0.12,<1",
]
train = [
  "numpy==2.0.2",
]
e5-runtime = [
  "numpy==2.0.2",
  "onnxruntime==1.28.0",
  "tokenizers==0.22.2",
]
materialize = [
  "pyarrow==23.0.1",
]
deepmind = [
  "absl-py==2.5.0",
  "numpy==2.4.6",
  "six==1.17.0",
  "sympy==1.14.0",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = ["ossp_router", "ossp_router.resources"]

[tool.setuptools.package-data]
"ossp_router.resources" = ["*.json"]

[tool.uv]
required-version = ">=0.12.3,<0.13"
conflicts = [
  [
    {group = "train"},
    {group = "deepmind"},
  ],
  [
    {group = "e5-runtime"},
    {group = "deepmind"},
  ],
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.11"}
e5-runtime = {requires-python = ">=3.11"}
materialize = {requires-python = ">=3.10"}
deepmind = {requires-python = ">=3.11"}

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
